# ---------------------------------------------------------------------------
# Render blueprint for the Safari Park Authority Engagement Tracker.
#
# What it provisions:
#   - One PostgreSQL database
#   - One Node web service (Starter, always-on) that builds the front end,
#     runs migrations, seeds on first boot, and serves both the API and the
#     React app on the same origin.
#
# Notes:
#   - The web service is on the Starter plan, so it does NOT spin down and
#     there is no cold start.
#   - The database is on the Basic-256mb plan (paid) — persistent, no 30-day
#     expiry. Render does not auto-apply DB plan changes from a blueprint
#     re-sync, so this value is declarative; change the live tier in the
#     Render dashboard.
#   - Uploaded files use object storage (STORAGE_BACKEND=s3 / R2, set in the
#     dashboard), so they survive restarts without a persistent disk.
# ---------------------------------------------------------------------------

databases:
  - name: spd-tracker-db
    plan: basic-256mb
    databaseName: spd_tracker
    user: spd_user

services:
  - type: web
    name: spd-tracker
    runtime: node
    # Starter ($7/mo) keeps the service always-on — no spin-down / cold start.
    # A paid Render account does NOT auto-upgrade a service; the instance type
    # is set here (and synced by the blueprint on every deploy).
    plan: starter
    region: oregon
    buildCommand: |
      set -e
      echo "--- installing & building frontend ---"
      cd frontend
      npm install --include=dev
      npm run build
      echo "--- installing backend ---"
      cd ../backend
      npm install --omit=dev
    startCommand: cd backend && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spd-tracker-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_MB
        value: "100"
      - key: CORS_ORIGIN
        value: https://ecgportal.dev
      - key: PGSSL
        value: "true"
      # Public URL of the front end — used to build invitation + reset links
      # in outgoing emails. Update if the service moves to a different host.
      - key: APP_URL
        value: https://ecgportal.dev
      # Outbound email — task assignment + day-before reminder, invites,
      # password resets. Without a provider, mail is only LOGGED (console mode)
      # and nothing is delivered. Recommended on Render: the Brevo HTTP API
      # (port 443; outbound SMTP is often blocked). Set BREVO_API_KEY in the
      # dashboard and verify the sender domain in Brevo. (SMTP_* are an
      # alternative — add them in the dashboard if you prefer SMTP.)
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        value: SPD Tracker <no-reply@ecgportal.dev>
      # Task reminders run daily (07:00 Asia/Qatar) and are ON by default.
      - key: TASK_REMINDERS_ENABLED
        value: "true"
      # Sensible defaults. Override in the Render dashboard for Sentry or the
      # weekly digest.
      - key: DIGEST_ENABLED
        value: "false"
      - key: LOG_LEVEL
        value: info
      # Project timezone. The database session tz and the reminder/digest cron
      # schedules are pinned to this so date math and scheduling agree.
      - key: APP_TZ
        value: Asia/Qatar
      # Document storage. Managed entirely in the dashboard (sync: false) so a
      # blueprint re-sync never resets your choice. Unset → defaults to local
      # disk (ephemeral). For permanent storage set STORAGE_BACKEND=s3 plus the
      # S3_* values in the dashboard — see STORAGE-SETUP.md.
      - key: STORAGE_BACKEND
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # MFA_ENC_KEY must be set in the Render dashboard. In production the
      # server now FAILS FAST at boot if it is missing/invalid (rather than
      # only erroring when the first user enrols MFA). Generate with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
